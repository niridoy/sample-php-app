name: Sample PHP CI/CD

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]

    workflow_dispatch:
        inputs:
            environment:
                description: "Target Environment"
                required: true
                type: choice
                default: dev
                options:
                    - dev
                    - stg
                    - prd

            deploy_ref:
                description: "Branch or Tag (PRD must be v*)"
                required: true
                default: main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: niridoy/sample-php-app
    GITOPS_REPO: niridoy/k8s-gitops
    GITOPS_FOLDER: sample-php

jobs:
    # ============================================================
    # PR BUILD (CI ONLY)
    # ============================================================
    pr-build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout Source
              uses: actions/checkout@v4

            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ secrets.GHCR_USERNAME }}
                  password: ${{ secrets.GHCR_TOKEN }}

            - name: Build & Push PR Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/niridoy/sample-php-app:pr-${{ github.event.pull_request.number }}

    # ============================================================
    # DEPLOY PIPELINE (CD)
    # ============================================================
    deploy:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            packages: write

        steps:
            # ---------------- VALIDATION ----------------
            - name: Validate Environment Rules
              run: |
                  ENV="${{ github.event.inputs.environment }}"
                  REF="${{ github.event.inputs.deploy_ref }}"

                  echo "ENV=$ENV"
                  echo "REF=$REF"

                  if [ "$ENV" = "prd" ]; then
                    if [[ ! "$REF" =~ ^v ]]; then
                      echo "❌ PROD ONLY allows tags starting with v"
                      exit 1
                    fi
                  fi

                  echo "✅ Validation Passed"

            # ---------------- IMAGE TAG LOGIC ----------------
            - name: Generate Image Tag
              run: |
                  ENV="${{ github.event.inputs.environment }}"
                  REF="${{ github.event.inputs.deploy_ref }}"

                  if [[ "$REF" == v* ]]; then
                    IMAGE_TAG="$REF"
                    SOURCE_TYPE="tag"
                  else
                    SAFE_REF=$(echo "$REF" | sed 's/\//-/g')
                    IMAGE_TAG="${ENV}-${SAFE_REF}-${GITHUB_RUN_NUMBER}"
                    SOURCE_TYPE="branch"
                  fi

                  echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
                  echo "SOURCE_TYPE=$SOURCE_TYPE" >> $GITHUB_ENV

            # ---------------- CHECKOUT APP ----------------
            - name: Checkout Application Code
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.deploy_ref }}

            # ---------------- GHCR LOGIN ----------------
            - name: Login to GHCR
              uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ secrets.GHCR_USERNAME }}
                  password: ${{ secrets.GHCR_TOKEN }}

            # ---------------- BUILD & PUSH IMAGE ----------------
            - name: Build & Push Image
              uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/niridoy/sample-php-app:${{ env.IMAGE_TAG }}

            # ============================================================
            # GITOPS UPDATE + PR
            # ============================================================
            - name: Checkout GitOps Repository
              uses: actions/checkout@v4
              with:
                  repository: niridoy/k8s-gitops
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops
                  fetch-depth: 0

            - name: Update GitOps Manifest
              id: gitops
              run: |
                  cd gitops

                  git config user.name "github-actions[bot]"
                  git config user.email "github-actions[bot]@users.noreply.github.com"

                  ENV="${{ github.event.inputs.environment }}"
                  REF="${{ github.event.inputs.deploy_ref }}"

                  BRANCH="${ENV}/sample-php-${IMAGE_TAG}"
                  FILE="sample-php/overlays/${ENV}/patch.yaml"

                  git checkout -b "$BRANCH"

                  echo "Updating image in $FILE"

                  # SAFE replace
                  sed -i "s|ghcr.io/niridoy/sample-php-app:.*|ghcr.io/niridoy/sample-php-app:${IMAGE_TAG}|g" "$FILE"

                  git add "$FILE"

                  # IMPORTANT FIX: real diff check
                  if git diff --cached --quiet; then
                    echo "NO_CHANGE=true" >> $GITHUB_ENV
                    echo "❌ No change detected → skipping PR"
                    exit 0
                  fi

                  git commit -m "[${ENV}][Sample-PHP][${SOURCE_TYPE}] Deploy ${IMAGE_TAG}"
                  git push origin "$BRANCH"

                  echo "PR_BRANCH=$BRANCH" >> $GITHUB_ENV

            # ---------------- CREATE PR ----------------
            - name: Create Pull Request
              if: env.NO_CHANGE != 'true'
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops
                  branch: ${{ env.PR_BRANCH }}
                  base: main
                  title: "[${{ github.event.inputs.environment }}][Sample-PHP][${{ env.SOURCE_TYPE }}] Deploy ${IMAGE_TAG}"
                  body: |
                      ## 🚀 Deployment Summary

                      **Environment:** ${{ github.event.inputs.environment }}  
                      **Source Ref:** ${{ github.event.inputs.deploy_ref }}  
                      **Source Type:** ${{ env.SOURCE_TYPE }}  
                      **Image:** ghcr.io/niridoy/sample-php-app:${{ env.IMAGE_TAG }}

                      ### Rules
                      - DEV → branch or tag allowed  
                      - STG → branch or tag allowed  
                      - PRD → tag only (`v*`)  

                      ---
                      Auto-generated by GitHub Actions CI/CD

            # ---------------- SUMMARY ----------------
            - name: Deployment Summary
              run: |
                  echo "===================================="
                  echo "ENV   : ${{ github.event.inputs.environment }}"
                  echo "REF   : ${{ github.event.inputs.deploy_ref }}"
                  echo "TAG   : $IMAGE_TAG"
                  echo "IMAGE : ghcr.io/niridoy/sample-php-app:${IMAGE_TAG}"
                  echo "===================================="
