name: CI/CD Pipeline

on:
    pull_request:
        branches: [main]
        types: [opened, synchronize, reopened]
    workflow_dispatch:
        inputs:
            environment:
                description: "Target GitOps environment"
                required: true
                default: "prd"
                type: choice
                options:
                    - dev
                    - stg
                    - prd
            deploy_ref:
                description: "Branch or tag to deploy"
                required: false
                default: "main"
                type: string

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}
    GITOPS_REPO: your-org/k8s-gitops
    GITOPS_OVERLAY_PATH: sample-php/overlays
    GITOPS_BRANCH_PREFIX: update-sample-php-image

jobs:
    build-pr:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push PR Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

    deploy-gitops-pr:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            packages: write

        steps:
            - name: Checkout repository
              uses: actions/checkout@v3
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.deploy_ref }}

            - name: Log in to GitHub Container Registry
              uses: docker/login-action@v2
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - name: Build and push deployment Docker image
              uses: docker/build-push-action@v4
              with:
                  context: .
                  push: true
                  tags: |
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
                      ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

            - name: Clone GitOps repository
              uses: actions/checkout@v3
              with:
                  repository: ${{ env.GITOPS_REPO }}
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops
                  fetch-depth: 0

            - name: Update GitOps deployment manifest
              run: |
                  cd gitops
                  git config user.email "github-actions[bot]@users.noreply.github.com"
                  git config user.name "github-actions[bot]"
                  env_name="${{ github.event.inputs.environment }}"
                  deploy_ref="${{ github.event.inputs.deploy_ref }}"
                  gitops_path="${{ env.GITOPS_OVERLAY_PATH }}/${{ github.event.inputs.environment }}/patch.yaml"
                  branch="${{ env.GITOPS_BRANCH_PREFIX }}-${{ github.sha }}-${{ github.event.inputs.environment }}"
                  git checkout -b "$branch"
                  sed -i "s|image: .*|image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}|" "$gitops_path"
                  git add "$gitops_path"
                  git diff --cached --quiet || git commit -m "chore: update sample-php image for $env_name from $deploy_ref to ${{ github.sha }}"
                  git push origin "$branch"

            - name: Create GitOps PR
              uses: peter-evans/create-pull-request@v5
              working-directory: gitops
              with:
                  token: ${{ secrets.GITOPS_TOKEN }}
                  repository: ${{ env.GITOPS_REPO }}
                  base: main
                  head: ${{ env.GITOPS_BRANCH_PREFIX }}-${{ github.sha }}-${{ github.event.inputs.environment }}
                  title: "chore: update sample-php deployment for ${{ github.event.inputs.environment }} from ${{ github.event.inputs.deploy_ref }} to ${{ github.sha }}"
                  body: |
                      This PR updates the k8s-gitops manifest for the `${{ github.event.inputs.environment }}` environment to deploy the new sample-php image built from `${{ github.event.inputs.deploy_ref }}` at commit `${{ github.sha }}`.
                  draft: false
