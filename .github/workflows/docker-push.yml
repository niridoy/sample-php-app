name: Sample PHP CI/CD

on:
    pull_request:
        branches: [main]

    workflow_dispatch:
        inputs:
            environment:
                description: "Target Environment"
                required: true
                type: choice
                options: [dev, stg, prd]

            deploy_ref:
                description: "Branch or Tag"
                required: true
                default: main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: niridoy/sample-php-app
    GITOPS_REPO: niridoy/k8s-gitops

# ------------------------------------------------------------
# PR BUILD
# ------------------------------------------------------------
jobs:
    pr-build:
        if: github.event_name == 'pull_request'
        runs-on: ubuntu-latest

        permissions:
            contents: read
            packages: write

        steps:
            - uses: actions/checkout@v4

            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ env.IMAGE_NAME }}:pr-${{ github.event.pull_request.number }}

    # ------------------------------------------------------------
    # DEPLOYMENT
    # ------------------------------------------------------------
    deploy:
        if: github.event_name == 'workflow_dispatch'
        runs-on: ubuntu-latest

        permissions:
            contents: write
            packages: write

        steps:
            # ---------------- VALIDATION ----------------
            - name: Validate Input
              run: |
                  ENV="${{ github.event.inputs.environment }}"
                  REF="${{ github.event.inputs.deploy_ref }}"

                  if [ "$ENV" = "prd" ] && [[ ! "$REF" =~ ^v ]]; then
                    echo "❌ PROD only allows tag starting with v"
                    exit 1
                  fi

            # ---------------- CHECKOUT APP ----------------
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
                  ref: ${{ github.event.inputs.deploy_ref }}

            # ---------------- IMAGE TAG ----------------
            - name: Generate Image Tag
              run: |
                  ENV="${{ github.event.inputs.environment }}"
                  REF="${{ github.event.inputs.deploy_ref }}"

                  if [[ "$REF" == v* ]]; then
                    IMAGE_TAG="$REF"
                    SOURCE_TYPE="tag"
                  else
                    SAFE_REF=$(echo "$REF" | tr '/' '-')
                    IMAGE_TAG="${ENV}-${SAFE_REF}-${GITHUB_RUN_NUMBER}"
                    SOURCE_TYPE="branch"
                  fi

                  echo "IMAGE_TAG=$IMAGE_TAG" >> $GITHUB_ENV
                  echo "SOURCE_TYPE=$SOURCE_TYPE" >> $GITHUB_ENV

            # ---------------- LOGIN ----------------
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}

            # ---------------- BUILD IMAGE ----------------
            - uses: docker/build-push-action@v6
              with:
                  context: .
                  push: true
                  tags: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

            # ---------------- GITOPS UPDATE ----------------
            - name: Update GitOps Repo
              run: |
                  rm -rf gitops
                  git clone https://x-access-token:${{ secrets.GITOPS_TOKEN }}@github.com/${{ env.GITOPS_REPO }}.git gitops

                  cd gitops

                  git config user.name "github-actions"
                  git config user.email "github-actions@users.noreply.github.com"

                  ENV="${{ github.event.inputs.environment }}"
                  FILE="sample-php/overlays/${ENV}/patch.yaml"
                  BRANCH="${ENV}/sample-php-${IMAGE_TAG}"

                  git checkout -b "$BRANCH"

                  # SAFE REPLACEMENT (IMPORTANT FIX)
                  sed -i "s|image:.*|image: ghcr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}|g" "$FILE"

                  git add "$FILE"

                  if git diff --cached --quiet; then
                    echo "NO_CHANGES=true" >> $GITHUB_ENV
                    exit 0
                  fi

                  git commit -m "[${ENV}][Sample-PHP][${SOURCE_TYPE}] Image ${IMAGE_TAG}"
                  git push origin "$BRANCH"

                  echo "BRANCH=$BRANCH" >> $GITHUB_ENV

            # ---------------- PR CREATE ----------------
            - name: Create PR
              if: env.NO_CHANGES != 'true'
              uses: peter-evans/create-pull-request@v7
              with:
                  token: ${{ secrets.GITOPS_TOKEN }}
                  path: gitops
                  branch: ${{ env.BRANCH }}
                  base: main
                  title: "[${{ github.event.inputs.environment }}][Sample-PHP][${{ env.SOURCE_TYPE }}] Image ${IMAGE_TAG}"
                  body: |
                      ## 🚀 Deployment Summary

                      - Environment: ${{ github.event.inputs.environment }}
                      - Source: ${{ github.event.inputs.deploy_ref }}
                      - Type: ${{ env.SOURCE_TYPE }}
                      - Image: ghcr.io/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}

                      Auto-generated by CI/CD pipeline
